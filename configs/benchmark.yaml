kind: benchmark
description: Solver comparison and time-budget trade-off on public Solomon VRPTW instances
  and the synthetic operational suite, at matched budgets.
seed: 2026
output_dir: experiments
results_dir: results
figures_dir: docs/figures
cache_dir: data/cache
cache_results: true
scenario:
  level: medium
  seed: 2026
  maintenance_count: 2
  scarcity: 1.0
  deadline_tightness: 0.5
  dependency_rate: 0.15
solvers:
- HEURISTIC
- LOCAL_SEARCH
- CP_SAT
- MIN_COST_FLOW
time_budgets:
- 5.0
- 30.0
disruption:
  rate: 0.0
  severity: medium
  seed: 7
benchmarks:
- name: solomon-clustered
  dataset: solomon
  instances:
  - c101
  - c201
  split: eval
- name: solomon-random
  dataset: solomon
  instances:
  - r101
  - r201
  split: eval
- name: jobshop-ft10
  dataset: jobshop
  instances:
  - ft10
  split: val
objective_weights:
  w_completion: 10.0
  w_priority: 2.0
  w_late: 0.4
  w_travel: 0.02
  w_cost: 0.01
  w_dispatch: 0.05
  w_overload: 0.5
  w_move_idle: 0.02
  w_violation: 50.0
weight_provenance: reported
