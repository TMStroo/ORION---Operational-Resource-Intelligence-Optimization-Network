# Serves the built frontend and proxies the API to the backend, so the
# application is written against one origin and never needs to know whether it
# is talking to a dev server or a container.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable; index.html must not be cached or a
    # deploy leaves clients on the previous bundle.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replanning and re-optimization can take a while under a time budget.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Single-page application: unknown paths fall back to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
